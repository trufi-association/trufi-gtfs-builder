name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check examples
        run: |
          for example in examples/Bolivia-Cochabamba examples/Mexico-Jilotepec; do
            echo "::group::$example"
            (cd "$example" && npm install --no-audit --no-fund && npx tsc --noEmit)
            echo "::endgroup::"
          done
          # Peru-Trujillo imports from ../../src directly, so the root tsc
          # already covers it; running it standalone would need a sibling
          # package.json/tsconfig. Skip here.
